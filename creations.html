<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Creations — PixPurge</title>
  <meta name="description" content="Browse and download the images you cleaned with PixPurge.">
  <meta name="keywords" content="pixpurge creations, my creations">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://pixpurge.com/creations.html">
  <meta property="og:title" content="My Creations — PixPurge">
  <meta property="og:description" content="Browse and download the images you cleaned with PixPurge.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pixpurge.com/creations.html">
  <meta name="theme-color" content="#EA580C">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { DEFAULT: '#0F172A', soft: '#334155', muted: '#64748B' },
            paper: { DEFAULT: '#FAFAF9', warm: '#F5F3F0' },
            surface: '#FFFFFF',
            coral: { DEFAULT: '#EA580C', hover: '#C2410C', light: '#FFF7ED' },
            teal: { DEFAULT: '#0F766E', light: '#F0FDFA' },
            amber: '#D97706',
            violet: { DEFAULT: '#6D28D9', light: '#F5F3FF' },
            line: { DEFAULT: '#E7E5E4', soft: '#F1EFEE' }
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif']
          },
          maxWidth: { site: '1200px' },
          boxShadow: {
            hero: '0 1px 3px rgba(15,23,42,0.05), 0 14px 32px -14px rgba(15,23,42,0.10)',
            pop: '0 2px 6px rgba(15,23,42,0.05), 0 10px 24px -12px rgba(15,23,42,0.10)',
            cta: '0 1px 2px rgba(234,88,12,0.28)',
            lift: '0 1px 2px rgba(15,23,42,0.04), 0 8px 18px -8px rgba(15,23,42,0.10)'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    /* ===== 去 AI 味的视觉精修（只改样式，不动布局/逻辑） ===== */
    .rounded-\[20px\] { border-radius: 16px !important; }
    .rounded-3xl { border-radius: 20px !important; }
  </style>
</head>
<body class="font-body text-ink-soft bg-paper leading-relaxed overflow-x-hidden antialiased flex flex-col min-h-screen" data-page="creations">

<!-- ===== Navbar (shared component, see components.js) ===== -->
<nav id="siteNavbar" class="sticky top-0 z-[100] bg-paper/90 backdrop-blur-md border-b border-line-soft"></nav>

<!-- ===== Mobile Nav ===== -->
<div class="hidden fixed inset-0 z-[200] bg-paper px-6 pt-20 pb-8 flex-col overflow-y-auto" id="siteMobileNav"></div>

<!-- ===== My Creations ===== -->
<main class="flex-1 w-full max-w-[1000px] mx-auto px-4 sm:px-6 py-10 sm:py-14">
  <div class="flex items-start justify-between gap-6 mb-2">
    <div>
      <h1 class="font-display text-[28px] sm:text-[34px] font-bold text-ink tracking-[-0.015em]">My Creations</h1>
      <p class="text-[14.5px] text-ink-muted mt-1.5">Your cleaned images, saved to your account.</p>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="flex items-center justify-between gap-4 my-7">
    <button type="button" id="sortBtn" class="inline-flex items-center gap-2 text-[13.5px] font-semibold text-ink bg-surface border border-line rounded-lg px-4 py-2.5 hover:bg-paper-warm transition-all">
      Sort: <span id="sortLabel">Newest</span>
      <svg class="w-4 h-4 text-ink-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <button type="button" id="selectBtn" class="inline-flex items-center justify-center font-semibold text-[14px] px-6 py-3 rounded-xl bg-coral text-white shadow-cta hover:bg-coral-hover transition-all">Select</button>
  </div>

  <!-- Not signed in -->
  <div id="creationsSignedOut" class="hidden bg-surface border border-line-soft rounded-[20px] shadow-hero p-6 sm:p-8 text-center">
    <p class="font-display text-[19px] font-bold text-ink mb-2">Sign in to view your creations</p>
    <p class="text-sm text-ink-muted mb-6">Your cleaned images are saved to your account after each run.</p>
    <a href="index.html" class="inline-flex items-center justify-center gap-2 font-semibold text-[14px] px-6 py-3 rounded-xl bg-coral text-white shadow-cta hover:bg-coral-hover transition-all">Go to the tool to sign in</a>
  </div>

  <!-- Grid -->
  <div id="creationsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-5"></div>
  <p id="creationsEmpty" class="hidden text-center text-ink-muted text-[14.5px] py-14">No creations yet — remove text from your first image in the tool.</p>

  <!-- Pagination -->
  <div id="pager" class="hidden flex items-center justify-center gap-1.5 mt-8">
    <button type="button" id="prevPage" class="w-9 h-9 flex items-center justify-center rounded-lg bg-surface border border-line text-ink-soft hover:bg-paper-warm disabled:opacity-40 disabled:pointer-events-none transition-all" aria-label="Previous page">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="pageLabel" class="text-[13.5px] font-semibold text-ink bg-surface border border-line rounded-lg px-3.5 py-2">1</span>
    <button type="button" id="nextPage" class="w-9 h-9 flex items-center justify-center rounded-lg bg-surface border border-line text-ink-soft hover:bg-paper-warm disabled:opacity-40 disabled:pointer-events-none transition-all" aria-label="Next page">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</main>

<!-- Select-mode floating bar -->
<div id="selectBar" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[300] bg-surface border border-line rounded-full shadow-pop px-4 py-3 flex items-center gap-3">
  <button type="button" onclick="exitSelectMode()" class="shrink-0 inline-flex items-center font-semibold text-[14px] text-ink-soft hover:text-ink transition-all" aria-label="Cancel selection">
    <span class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-paper-warm transition-all">Cancel</span>
  </button>
  <button type="button" onclick="downloadSelected()" class="inline-flex items-center gap-2 font-semibold text-[15px] px-7 py-3.5 rounded-full bg-coral text-white shadow-cta hover:bg-coral-hover transition-all">
    <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download <span id="selCount" class="font-bold">(0)</span>
  </button>
</div>

<footer id="siteFooter" class="border-t border-line-soft bg-surface"></footer>

<script src="components.js"></script>
<script>

  // ===== My Creations =====
  var pageNum = 1;
  var pageSize = 6; // 每页 6 个（两排），分页条随页数出现
  var total = 0;
  var sortAsc = false; // false = newest first
  var selectMode = false;
  var selected = {}; // id -> true
  var items = [];

  function authHeaders() {
    var token = null;
    try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
    return token ? { 'Authorization': 'Bearer ' + token } : {};
  }

  function fmtDate(iso) {
    if (!iso) return '';
    try {
      // MySQL 返回 "YYYY-MM-DD HH:MM:SS"（无 T/Z），先转 ISO 再解析
      var s = String(iso).replace(' ', 'T');
      var d = new Date(s);
      if (isNaN(d.getTime()) || d.getFullYear() < 2000) return String(iso).slice(0, 10);
      var y = d.getFullYear();
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      var day = ('0' + d.getDate()).slice(-2);
      return y + '-' + m + '-' + day;
    } catch (e) { return String(iso || '').slice(0, 10); }
  }

  function loadCreations() {
    fetch(API_BASE + '/site/works?pageNum=' + pageNum + '&pageSize=' + pageSize, { headers: authHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(json) {
        if (json && json.code === '00000' && json.data) {
          items = json.data.list || [];
          total = json.data.total || 0;
          render();
        } else if (json && (json.code === 'A0230' || json.code === 'A0301')) {
          document.getElementById('creationsSignedOut').classList.remove('hidden');
        }
      })
      .catch(function() {});
  }

  function render() {
    var grid = document.getElementById('creationsGrid');
    var empty = document.getElementById('creationsEmpty');
    var pager = document.getElementById('pager');
    grid.innerHTML = '';
    if (!items.length) {
      empty.classList.remove('hidden');
      pager.classList.add('hidden');
      return;
    }
    empty.classList.add('hidden');
    var list = items.slice();
    if (sortAsc) list.reverse();
    list.forEach(function(w) {
      var card = document.createElement('div');
      card.className = 'bg-surface border border-line-soft rounded-2xl p-3 hover:shadow-lift hover:border-line transition-all duration-300 relative' + (selectMode ? ' cursor-pointer' : '');
      var isSel = !!selected[w.id];
      if (isSel) card.classList.add('!border-coral', '!shadow-cta');
      // 选择模式：点击卡片任意处（除按钮）即选中/取消
      card.addEventListener('click', function(e) {
        if (!selectMode) return;
        if (e.target && e.target.closest && e.target.closest('button')) return;
        toggleSelect(w.id);
      });
      var title = w.origName || 'Text Removed';
      var name = title.replace(/\.[^.]+$/, '');
      card.innerHTML =
        '<div class="relative rounded-xl overflow-hidden bg-paper-warm">' +
          '<img src="' + (w.thumb || '') + '" alt="' + title + '" class="w-full aspect-[4/3] object-cover">' +
          '<span class="absolute top-2 left-2 text-[10.5px] font-bold bg-surface/95 text-ink-soft px-2 py-1 rounded-full">Text Removed</span>' +
          (selectMode
            ? '<button type="button" class="absolute top-2 right-2 w-6 h-6 rounded-full flex items-center justify-center border-2 ' +
                (isSel ? 'bg-coral border-coral text-white' : 'bg-surface/95 border-line text-transparent') +
                '" onclick="toggleSelect(' + w.id + ')" aria-label="Select">' +
                '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>'
            : '') +
        '</div>' +
        '<div class="flex items-center justify-between gap-2 mt-3 px-1">' +
          '<div class="min-w-0">' +
            '<p class="text-[13.5px] font-semibold text-ink truncate">Text Removed</p>' +
            '<p class="text-[12px] text-ink-muted mt-0.5">' + fmtDate(w.createTime) + '</p>' +
          '</div>' +
          '<div class="flex items-center gap-1">' +
            '<button type="button" class="w-8 h-8 flex items-center justify-center rounded-lg text-ink-muted hover:bg-paper-warm hover:text-ink transition-all" onclick="downloadOne(' + w.id + ')" aria-label="Download">' +
              '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
            '</button>' +
            '<button type="button" class="w-8 h-8 flex items-center justify-center rounded-lg text-coral hover:bg-coral-light transition-all" onclick="deleteOne(' + w.id + ')" aria-label="Delete">' +
              '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
    var pages = Math.max(1, Math.ceil(total / pageSize));
    document.getElementById('pageLabel').textContent = pageNum;
    document.getElementById('prevPage').disabled = pageNum <= 1;
    document.getElementById('nextPage').disabled = pageNum >= pages;
    pager.classList.remove('hidden');
  }

  function toggleSelect(id) {
    if (selected[id]) delete selected[id];
    else selected[id] = true;
    render();
    var n = Object.keys(selected).length;
    document.getElementById('selCount').textContent = '(' + n + ')';
  }

  function enterSelectMode() {
    selectMode = true;
    selected = {};
    document.getElementById('selectBar').classList.remove('hidden');
    document.getElementById('selectBtn').textContent = 'Done';
    render();
  }

  function exitSelectMode() {
    selectMode = false;
    selected = {};
    document.getElementById('selectBar').classList.add('hidden');
    document.getElementById('selectBtn').textContent = 'Select';
    render();
  }

  function downloadOne(id) {
    fetch(API_BASE + '/site/works/' + id + '/image', { headers: authHeaders() })
      .then(function(r) { return r.blob(); })
      .then(function(b) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'pixpurge-' + id + '.jpg';
        a.click();
        setTimeout(function() { URL.revokeObjectURL(a.href); }, 4000);
      })
      .catch(function() {});
  }

  function downloadSelected() {
    var ids = Object.keys(selected);
    ids.forEach(function(id) { downloadOne(id); });
  }

  function deleteOne(id) {
    fetch(API_BASE + '/site/works/' + id, { method: 'DELETE', headers: authHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(json) {
        if (json && json.code === '00000') {
          items = items.filter(function(w) { return String(w.id) !== String(id); });
          total = Math.max(0, total - 1);
          if (!items.length && pageNum > 1) { pageNum -= 1; loadCreations(); return; }
          render();
        }
      })
      .catch(function() {});
  }

  document.getElementById('selectBtn').addEventListener('click', function() {
    if (selectMode) exitSelectMode();
    else enterSelectMode();
  });

  document.getElementById('prevPage').addEventListener('click', function() {
    if (pageNum > 1) { pageNum -= 1; loadCreations(); }
  });

  document.getElementById('nextPage').addEventListener('click', function() {
    var pages = Math.max(1, Math.ceil(total / pageSize));
    if (pageNum < pages) { pageNum += 1; loadCreations(); }
  });

  document.getElementById('sortBtn').addEventListener('click', function() {
    sortAsc = !sortAsc;
    document.getElementById('sortLabel').textContent = sortAsc ? 'Oldest' : 'Newest';
    render();
  });

  document.addEventListener('click', function(e) {
    var menu = document.getElementById('navUserMenu');
    var avatar = document.getElementById('navAvatar');
    if (menu && avatar && !menu.classList.contains('hidden') && !avatar.contains(e.target) && !menu.contains(e.target)) {
      menu.classList.add('hidden');
    }
  });

  loadCreations();
</script>
</body>
</html>
